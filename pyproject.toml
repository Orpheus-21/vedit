[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
dynamic = ["version"]
description = "A command-line tool for simple video edits with ffmpeg and ImageMagick"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/Orpheus-21/vedit"

[project.scripts]
vedit = "vedit:main"

[tool.setuptools]
py-modules = ["vedit"]

[tool.setuptools.dynamic]
version = {attr = "vedit.__version__"}
